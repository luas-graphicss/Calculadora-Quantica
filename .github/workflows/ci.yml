name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, contracts and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install the locked environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check types
        run: uv run --no-sync mypy
      - name: Run contract tests
        run: uv run --no-sync pytest tests/contracts --junitxml=test-reports/contracts.xml
      - name: Run exact algebraic identities
        run: uv run --no-sync pytest -m algebraic --junitxml=test-reports/algebraic.xml
      - name: Run numerical comparisons with declared tolerance
        run: uv run --no-sync pytest -m numerical --junitxml=test-reports/numerical.xml
      - name: Run the remaining tests
        run: uv run --no-sync pytest -m "not algebraic and not numerical" --ignore=tests/contracts --junitxml=test-reports/remaining.xml
      - name: Publish the suite report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-reports
          path: test-reports/
          if-no-files-found: error

  clean-install:
    name: Reproduce the reference cases from a clean install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Install the wheel with the locked runtime dependencies only
        run: |
          uv export --locked --no-dev --no-emit-project --output-file runtime-requirements.txt
          uv venv --python 3.12 clean-environment
          uv pip install --python clean-environment/bin/python --require-hashes --requirement runtime-requirements.txt
          uv pip install --python clean-environment/bin/python --no-deps dist/*.whl
      - name: Reproduce the reference case
        run: |
          mkdir reproduction
          clean-environment/bin/qcalc validate reference_cases/quantum/electron_box_1nm.json | tee reproduction/electron_box_1nm.validate.txt
          clean-environment/bin/qcalc solve reference_cases/quantum/electron_box_1nm.json | tee reproduction/electron_box_1nm.solve.txt
          clean-environment/bin/qcalc solve reference_cases/quantum/electron_box_1nm.json --format json > reproduction/electron_box_1nm.run_record.json
          jq '.environment' reproduction/electron_box_1nm.run_record.json
      - name: Compare the run record with the recorded evidence
        run: |
          jq 'del(.environment)' reproduction/electron_box_1nm.run_record.json > reproduction/reproduced-content.json
          jq 'del(.environment)' docs/evidence/phase-1/electron_box_1nm.run_record.json > reproduction/recorded-content.json
          diff reproduction/recorded-content.json reproduction/reproduced-content.json
      - name: Reproduce the symbolic cases
        run: |
          mkdir symbolic-reproduction
          clean-environment/bin/qcalc catalog | tee symbolic-reproduction/catalog.txt
          clean-environment/bin/qcalc catalog --format json > symbolic-reproduction/catalog.json
          clean-environment/bin/qcalc validate reference_cases/symbolic/product_rule.json | tee symbolic-reproduction/product_rule.validate.txt
          clean-environment/bin/qcalc solve reference_cases/symbolic/decay_initial_value.json | tee symbolic-reproduction/decay_initial_value.solve.txt
          clean-environment/bin/qcalc solve reference_cases/symbolic/decay_initial_value.json --format json > symbolic-reproduction/decay_initial_value.run_record.json
          review_status=0
          clean-environment/bin/qcalc solve reference_cases/symbolic/decay_candidate_wrong_initial_value.json --format json > symbolic-reproduction/decay_candidate_wrong_initial_value.run_record.json || review_status=$?
          test "$review_status" -eq 5
      - name: Compare the symbolic output with the recorded evidence
        run: |
          diff docs/evidence/phase-2/catalog.txt symbolic-reproduction/catalog.txt
          diff docs/evidence/phase-2/catalog.json symbolic-reproduction/catalog.json
          diff docs/evidence/phase-2/product_rule.validate.txt symbolic-reproduction/product_rule.validate.txt
          for record in decay_initial_value decay_candidate_wrong_initial_value; do
            jq 'del(.environment)' "symbolic-reproduction/$record.run_record.json" > "symbolic-reproduction/$record.reproduced-content.json"
            jq 'del(.environment)' "docs/evidence/phase-2/$record.run_record.json" > "symbolic-reproduction/$record.recorded-content.json"
            diff "symbolic-reproduction/$record.recorded-content.json" "symbolic-reproduction/$record.reproduced-content.json"
          done
      - name: Confirm that rejected inputs exit non-zero without a result
        run: |
          for input in reference_cases/quantum/rejected/*.json reference_cases/symbolic/rejected/*.json; do
            if [ "$(basename "$input")" = "expectations.json" ]; then
              continue
            fi
            if result=$(clean-environment/bin/qcalc solve "$input" --format json 2> /dev/null); then
              echo "::error::$input was accepted"
              exit 1
            fi
            if [ -n "$result" ]; then
              echo "::error::$input printed a result"
              exit 1
            fi
          done
      - name: Publish the reproduction
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase-1-reproduction
          path: reproduction/
          if-no-files-found: error
      - name: Publish the symbolic reproduction
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase-2-reproduction
          path: symbolic-reproduction/
          if-no-files-found: error
