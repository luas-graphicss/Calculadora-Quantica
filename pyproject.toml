[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "quantum-calculator"
version = "0.1.0"
description = "Bancada de cálculo para físicos: da equação a uma resposta que outra pessoa consegue conferir."
readme = "README.md"
requires-python = "==3.12.*"
license-files = ["LICENSE"]
keywords = ["physics", "quantum-mechanics", "units", "reproducibility"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["sympy==1.14.0"]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "types-jsonschema==4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_calculator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["quantum_calculator"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "algebraic: identidades exatas, comparadas por igualdade de racionais",
    "numerical: comparações numéricas com tolerância declarada",
]
